name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        The more precise the numbers and logs you give, the faster this gets fixed.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I read the [Troubleshooting](https://github.com/Spegeli/hacs_bitpanda#-troubleshooting) section.
          required: true
        - label: I searched [existing issues](https://github.com/Spegeli/hacs_bitpanda/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: I am running the [latest release](https://github.com/Spegeli/hacs_bitpanda/releases) of this integration.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Price Tracker (price sensors, currencies, Add price tracker)
        - Portfolio (wallet, staking and total sensors)
        - Portfolio (total value, cash, Cash Plus, returns)
        - Dialogs (setup, Configure, Reconfigure, new API key)
        - Refresh action (bitpanda.refresh)
        - Upgrade from a date version
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Settings → Devices & services → Bitpanda, or the `version` field in `manifest.json`.
      placeholder: e.g. 2.0.0
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings → About.
      placeholder: e.g. 2025.9.1
    validations:
      required: true

  - type: input
    id: currency
    attributes:
      label: Currencies involved
      description: The Portfolio's currency, or the Price Tracker's additional currencies, if the problem concerns them.
      placeholder: e.g. EUR
    validations:
      required: false

  - type: input
    id: asset
    attributes:
      label: Affected asset or wallet
      description: Which symbol shows the problem? Leave empty if it affects everything.
      placeholder: e.g. BTC, BCI5, XAU, or an ISIN such as FR0011871136
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior. Include the exact value the sensor shows, if a value is wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: If a number is wrong, give the correct number and how you calculated it.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Settings → System → Logs → filter for `bitpanda`.
        For more detail: on the Bitpanda integration page, ⋮ → **Enable debug logging**, reproduce the problem, then disable it — the log downloads.
        Or add this to `configuration.yaml`, restart, and reproduce:

        ```yaml
        logger:
          logs:
            custom_components.bitpanda: debug
        ```
      render: text
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → Bitpanda → ⋮ on **Bitpanda Portfolio** or **Bitpanda Price Tracker** → Download diagnostics. The API key is left out automatically.
      render: json
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Never paste your Bitpanda API key.** Diagnostics redact it for you, but raw logs or screenshots may not.
        > If you posted a key by accident, revoke it immediately at https://app.bitpanda.com/my-account/apikey.
