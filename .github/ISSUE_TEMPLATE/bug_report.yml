name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        The more precise the numbers and logs you give, the faster this gets fixed.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I read the [Troubleshooting](https://github.com/Spegeli/hacs_bitpanda#-troubleshooting) and [FAQ](https://github.com/Spegeli/hacs_bitpanda#-faq) sections.
          required: true
        - label: I searched [existing issues](https://github.com/Spegeli/hacs_bitpanda/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: I am running the [latest release](https://github.com/Spegeli/hacs_bitpanda/releases) of this integration.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Price Tracker (price sensors, currencies, Add price tracker)
        - Portfolio (wallet, staking and total sensors)
        - Portfolio (total value, cash, Cash Plus, returns)
        - Upgrade from an older version
        - Setup / Configuration flow
        - Manual refresh service
        - Other / not sure
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Settings → Devices & Services → Bitpanda, or the `version` field in `manifest.json`.
      placeholder: e.g. 2026.06.04
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2025.9.1
    validations:
      required: true

  - type: input
    id: currency
    attributes:
      label: Configured currency
      placeholder: e.g. EUR
    validations:
      required: true

  - type: input
    id: asset
    attributes:
      label: Affected asset or wallet
      description: Which symbol shows the problem? Leave empty if it affects everything.
      placeholder: e.g. BCI5, BTC, XAU, EUR
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior. Include the exact value the sensor shows, if a value is wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: If a number is wrong, give the correct number and how you calculated it.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Settings → System → Logs → filter for `bitpanda`.
        For more detail, add this to `configuration.yaml`, restart, and reproduce:

        ```yaml
        logger:
          logs:
            custom_components.bitpanda: debug
        ```
      render: text
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & Services → Bitpanda → ⋮ → Download diagnostics. The API key is redacted automatically.
      render: json
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Never paste your Bitpanda API key.** Diagnostics redact it for you, but raw logs or screenshots may not.
        > If you posted a key by accident, revoke it immediately at https://app.bitpanda.com/my-account/apikey.
