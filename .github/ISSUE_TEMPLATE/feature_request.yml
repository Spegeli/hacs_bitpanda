name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve this integration? Fill out the form below.

        > [!IMPORTANT]
        > **Stocks, ETFs and commodities cannot be added.** They are not part of the public Bitpanda
        > Price Ticker API, so there is no price data to build on. Requests for these will be closed.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/Spegeli/hacs_bitpanda/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: This is not a request for stocks, ETFs or commodities.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - Price Tracker (asset price sensor)
        - Wallet Monitor (wallet balance sensor)
        - Portfolio Total
        - Setup / Configuration flow
        - Services / automations
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: What problem does this solve?
      description: Describe the concrete situation where the integration falls short today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the integration do instead? Name the sensor, attribute or option you have in mind.
    validations:
      required: true

  - type: textarea
    id: api_reference
    attributes:
      label: Bitpanda API reference
      description: If this needs data from the Bitpanda API, link the relevant endpoint in the [API docs](https://developers.bitpanda.com/platform).
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Template sensors, automations or other workarounds you already tried.
    validations:
      required: false
