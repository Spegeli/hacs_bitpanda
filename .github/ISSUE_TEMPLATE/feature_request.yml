name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve this integration? Fill out the form below.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/Spegeli/hacs_bitpanda/issues?q=is%3Aissue) and this is not a duplicate.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - Price Tracker (price sensors, currencies, Add price tracker)
        - Portfolio (wallet, staking and total sensors)
        - Portfolio (total value, cash, Cash Plus, returns)
        - Upgrade from an older version
        - Setup / Configuration flow
        - Services / automations
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: What problem does this solve?
      description: Describe the concrete situation where the integration falls short today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the integration do instead? Name the sensor, attribute or option you have in mind.
    validations:
      required: true

  - type: textarea
    id: api_reference
    attributes:
      label: Bitpanda API reference
      description: If this needs data from the Bitpanda API, link the relevant endpoint in the [API docs](https://docs.public.bitpanda.com).
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Template sensors, automations or other workarounds you already tried.
    validations:
      required: false
