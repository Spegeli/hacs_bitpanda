name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve this integration? Fill out the form below.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/Spegeli/hacs_bitpanda/issues?q=is%3Aissue) and this is not a duplicate.
          required: true
        - label: I read the [Known limitations](https://github.com/Spegeli/hacs_bitpanda#%EF%B8%8F-known-limitations) — some wishes need data the Bitpanda API does not provide.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - Price Tracker (price sensors, currencies, Add price tracker)
        - Portfolio wallets (Balance (available), Balance (total), Balance (staking))
        - Portfolio (Total value, Cash, Cash Plus, returns, Invested, Total return, group values)
        - Notifications and events (new wallets, staking rewards, Earn changes, event entities)
        - Dashboard card (Bitpanda Portfolio)
        - Dashboard card (Bitpanda Price Tracker)
        - Dialogs (setup, Configure, Reconfigure, new API key)
        - Actions (bitpanda.refresh, bitpanda.get_portfolio, bitpanda.get_portfolio_history, bitpanda.get_staking_rewards)
        - Upgrade from a date version
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: What problem does this solve?
      description: Describe the concrete situation where the integration falls short today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the integration do instead? Name the sensor, attribute, option or card you have in mind.
    validations:
      required: true

  - type: textarea
    id: api_reference
    attributes:
      label: Bitpanda API reference
      description: If this needs data from the Bitpanda API, link the relevant endpoint in the [API docs](https://docs.public.bitpanda.com).
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Template sensors, automations or other workarounds you already tried.
    validations:
      required: false
