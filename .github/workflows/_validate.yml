name: Validate (internal)

# Reusable workflow (workflow_call): the checks every change and every
# release must pass. validate.yml calls it for pushes, pull requests and
# manual runs; release.yml runs it before it commits anything.
#   always       - hassfest, HACS, the Python 3.13 checks and the release
#                  script on Python 3.12: quick checks of what ships and of
#                  what releases it
#   inputs.tests - the tests with their coverage, the tests on the minimum
#                  Home Assistant and mypy --strict, minutes each. Only a
#                  manual Validate run can switch them off; a release never
#                  does.
# hassfest, the tests and mypy check against one Home Assistant release: the
# newest stable one with a pytest-homeassistant-custom-component release,
# never a beta. Each of the three jobs finds it first
# (.github/scripts/ha_version.py), so a new stable release reaches them
# without a change here -- and can turn a run red without one. The tests run
# a second time against the minimum release, "homeassistant" in hacs.json
# (tests/requirements-floor.txt), without the coverage gate: a change or a
# test that works only on newer releases turns the run red there.
# Callers set permissions: contents: read.

on:
  workflow_call:
    inputs:
      tests:
        description: "Run the tests (with coverage, and on the minimum Home Assistant) and mypy --strict"
        required: false
        default: true
        type: boolean

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Find the newest stable Home Assistant
        id: ha
        run: python3 .github/scripts/ha_version.py >> "$GITHUB_OUTPUT"
      # hassfest as exactly that release, not the newest image, which follows
      # betas too; the matcher makes an annotation of each finding.
      - name: Run hassfest
        env:
          HOME_ASSISTANT: ${{ steps.ha.outputs.home_assistant }}
        run: |
          echo "::add-matcher::${GITHUB_WORKSPACE}/.github/hassfest-matcher.json"
          docker run --rm -v "${GITHUB_WORKSPACE}:/github/workspace" "ghcr.io/home-assistant/hassfest:${HOME_ASSISTANT}"

  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  # Home Assistant 2025.5, the floor (hacs.json), runs on Python 3.13; the
  # tests with coverage and mypy run on 3.14. Compiling needs no Home
  # Assistant and fails on any syntax newer than 3.13; CONTRIBUTING.md names
  # what else the floor's Python asks of the code.
  python-floor:
    name: Python 3.13 syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile the integration with Python 3.13
        run: python -m compileall -q custom_components/bitpanda
      # 3.13 evaluates annotations as it defines a class or function, so a
      # name defined further down fails the import there -- which compiling
      # cannot catch. This import defers them, in every module.
      - name: Check that every module imports annotations from __future__
        run: |
          missing=$(grep -L '^from __future__ import annotations' custom_components/bitpanda/*.py || true)
          if [ -n "$missing" ]; then
            echo "Missing 'from __future__ import annotations':"
            echo "$missing"
            exit 1
          fi

  # The release's key job runs .github/scripts/release.py on the runner's own
  # python3 -- 3.12 on ubuntu-24.04 -- because it may run no action but
  # actions/checkout (spec section 11). The tests and mypy use 3.14, so a
  # change the script needs a newer Python for would otherwise show only at
  # release time. This job compiles it with 3.12 and plans a release from
  # the whole history and its tags, which the plan refuses to do without.
  release-script:
    name: Release script on Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile the release script with Python 3.12
        run: python -m py_compile .github/scripts/release.py
      - name: Plan a stable release with Python 3.12
        run: python .github/scripts/release.py plan --type stable --bump auto

  pytest:
    name: Tests with coverage
    if: inputs.tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Find the newest stable Home Assistant
        id: ha
        run: python3 .github/scripts/ha_version.py >> "$GITHUB_OUTPUT"
      - name: Install the test requirements
        env:
          PLUGIN: ${{ steps.ha.outputs.plugin }}
        run: python -m pip install -r tests/requirements.txt "pytest-homeassistant-custom-component==${PLUGIN}"
      - name: Run the tests
        run: >-
          python -m pytest tests/ -q
          --cov=custom_components.bitpanda
          --cov-report=term-missing
          --cov-fail-under=95

  pytest-minimum:
    name: Tests on the minimum Home Assistant
    if: inputs.tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements-floor.txt
      - name: Install the test requirements of the minimum Home Assistant
        run: python -m pip install -r tests/requirements-floor.txt
      # The package in tests/requirements-floor.txt pins one release; it must
      # be the one hacs.json promises, or this job tests another minimum.
      - name: Check that this is the minimum Home Assistant in hacs.json
        run: |
          python - <<'PY'
          import json
          from homeassistant.const import __version__ as installed
          with open("hacs.json", encoding="utf-8") as file:
              minimum = json.load(file)["homeassistant"]
          if installed != minimum:
              # On stdout: GitHub reads workflow commands such as ::error:: there.
              print(
                  f"::error::tests/requirements-floor.txt installs Home Assistant {installed}, "
                  f"but hacs.json names {minimum} as the minimum: pin the test package of "
                  f"{minimum} there, or raise both together."
              )
              raise SystemExit(1)
          print(f"Home Assistant {installed}, the minimum in hacs.json")
          PY
      - name: Run the tests
        run: python -m pytest tests/ -q

  mypy:
    name: Strict typing
    if: inputs.tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Find the newest stable Home Assistant
        id: ha
        run: python3 .github/scripts/ha_version.py >> "$GITHUB_OUTPUT"
      # Home Assistant included: mypy checks the integration against its types.
      - name: Install the test requirements
        env:
          PLUGIN: ${{ steps.ha.outputs.plugin }}
        run: python -m pip install -r tests/requirements.txt "pytest-homeassistant-custom-component==${PLUGIN}"
      - name: Run mypy --strict
        run: python -m mypy --strict
