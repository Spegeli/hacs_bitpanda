name: Tests

# The suite with its coverage, strict typing, and a compile of the
# integration with the Python of the 2025.5 floor, for every push to any
# branch and every pull request. No schedule: GitHub disables a workflow
# that has one after 60 days without repository activity, and it then runs
# on no push either.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Tests with coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install the test requirements
        run: python -m pip install -r requirements_test.txt
      - name: Run the tests
        run: >-
          python -m pytest tests/ -q
          --cov=custom_components.bitpanda
          --cov-report=term-missing
          --cov-fail-under=95

  mypy:
    name: Strict typing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # Home Assistant included: mypy checks the integration against its types.
      - name: Install the test requirements
        run: python -m pip install -r requirements_test.txt
      - name: Run mypy --strict
        run: python -m mypy --strict

  # Home Assistant 2025.5, the floor (hacs.json), runs on Python 3.13, the
  # jobs above on 3.14 only. Compiling needs no Home Assistant and fails on
  # any syntax newer than 3.13; CONTRIBUTING.md names what else the floor's
  # Python asks of the code.
  python-floor:
    name: Python 3.13 syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile the integration with Python 3.13
        run: python -m compileall -q custom_components/bitpanda
      # 3.13 evaluates annotations as it defines a class or function, so a
      # name defined further down fails the import there -- which compiling
      # cannot catch. This import defers them, in every module.
      - name: Check that every module imports annotations from __future__
        run: |
          missing=$(grep -L '^from __future__ import annotations' custom_components/bitpanda/*.py || true)
          if [ -n "$missing" ]; then
            echo "Missing 'from __future__ import annotations':"
            echo "$missing"
            exit 1
          fi
