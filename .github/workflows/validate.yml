name: Validate

# Checks a change without publishing anything: hassfest, HACS, the Python
# 3.13 checks, the release script on Python 3.12, the tests with their
# coverage, the tests on the minimum Home Assistant and mypy --strict (all in
# _validate.yml).
#   push to any branch but main - everything, on every topic branch and dev;
#                                 summed up as "Validation summary"
#   pull request to main        - everything, summed up as "Validation
#                                 result": the check main's ruleset requires,
#                                 so nothing merges unvalidated
#   pull request to dev         - everything, so a contribution is checked
#                                 before it merges; summed up as "Validation
#                                 summary", so that it never answers for
#                                 main's check on the same commit
#   either pull request runs a contributor's code from a fork with a
#   read-only token and no secrets: pull_request, never pull_request_target
#   manual                      - on any branch; the tests as chosen;
#                                 summed up as "Validation summary"
# main itself needs no run: changes only arrive through a validated pull
# request, or as the release's version commit, validated just before.
# No schedule: GitHub disables a workflow that has one after 60 days without
# repository activity, and then it runs on no push either.

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Validate PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || github.event_name == 'workflow_dispatch' && !inputs.tests
      && format('Validate {0} (no tests)', github.ref_name)
      || format('Validate {0}', github.ref_name) }}

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      tests:
        description: "Also run the tests (with coverage, and on the minimum Home Assistant) and mypy --strict"
        type: boolean
        default: true

# A newer push or pull request update makes the running validation obsolete.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/_validate.yml
    with:
      tests: ${{ github.event_name != 'workflow_dispatch' || inputs.tests }}

  # The one check main's ruleset requires; a fixed name stays valid when the
  # jobs above change. Only the run of a pull request to main reports under
  # that name; push and manual runs, and the run of a pull request to dev,
  # report as "Validation summary": the ruleset matches the check by name on
  # the pull request's head commit, and any other run there counts as well.
  # So only the pull request's own run, which validates the merge result
  # into main, can satisfy it, and a push's run that a manual one cancelled
  # leaves no red "Validation result" beside it. always(), not
  # !cancelled(): a skipped job counts as passed for a required check, so a
  # failed or cancelled validation must still run this job and fail it. It
  # needs every other job, or one could fail and leave it green.
  result:
    name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'Validation result' || 'Validation summary' }}
    needs: [checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A check switched off by hand is skipped inside the call, which still
      # ends in success. Anything but success -- a check that failed or timed
      # out, a cancelled run -- fails the check. It reads the result of every
      # job it needs, whichever they are, so a job added to needs is checked
      # too; no result at all fails as well.
      - name: Summarize
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          passed=0
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::Validation did not pass"
              exit 1
            fi
            passed=$((passed + 1))
          done
          if [ "${passed}" -eq 0 ]; then
            echo "::error::No check reported a result"
            exit 1
          fi
