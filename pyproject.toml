# Tool configuration only: this repository is not a Python package (it
# ships a Home Assistant integration under custom_components/bitpanda/,
# installed through HACS or copied by hand) and declares no [project]
# table.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Strict typing of the integration (quality scale rule strict-typing):
# `mypy --strict` over custom_components.bitpanda, run from the repository
# root -- by CI (.github/workflows/_validate.yml) and locally alike:
#   python -m mypy --strict
# The tests are not type-checked.
#
# No python_version: mypy checks for the Python it runs on, 3.14, which the
# pinned Home Assistant needs -- its own source does not parse as 3.13. The
# code must still run on 3.13, the Python of the 2025.5 floor: CI compiles
# it with 3.13, and CONTRIBUTING.md ("Home Assistant 2025.5 is the floor")
# names the rules the compile cannot check.
[tool.mypy]
packages = ["custom_components.bitpanda"]
strict = true

# Home Assistant ships py.typed. Its recorder package imports get_instance
# from its util module without re-exporting it, which strict mode's
# no_implicit_reexport refuses; importing it from the package is what Home
# Assistant's own integrations do, and what this one does.
[[tool.mypy.overrides]]
module = "homeassistant.components.recorder"
implicit_reexport = true
